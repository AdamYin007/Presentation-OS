name: Check

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  check:
    name: npm run check:all
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check:all
